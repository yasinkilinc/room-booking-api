services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: ${DB_PASSWORD:?copy .env.example to .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/booking
      DB_USER: booking
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?copy .env.example to .env}
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8080:8080"

volumes:
  db-data:
